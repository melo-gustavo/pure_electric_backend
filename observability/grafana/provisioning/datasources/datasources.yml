apiVersion: 1

# GRAFANA_PROMETHEUS_URL / GRAFANA_LOKI_URL: Grafana expands ${VAR} in
# provisioning files from its own process environment at startup. Locally
# (docker-compose) these default to the compose service names; on Railway
# they're set explicitly to each service's <name>.railway.internal domain.
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: ${GRAFANA_PROMETHEUS_URL}
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${GRAFANA_LOKI_URL}
