global:
  scrape_interval: 5s

# Railway private-network targets (each service's Settings → Networking →
# Private Networking shows its own <name>.railway.internal domain — update
# these if a service is recreated and gets a different one).
scrape_configs:
  - job_name: pure_electric_api
    static_configs:
      - targets: ["pureelectricbackend.railway.internal:8080"]

  - job_name: pure_electric_worker
    static_configs:
      - targets: ["selfless-happiness.railway.internal:9200"]
