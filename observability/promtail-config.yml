server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: pure_electric_app
    static_configs:
      - targets: ["localhost"]
        labels:
          job: pure_electric_app
          __path__: /var/log/app/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
      - labels:
          level:
          logger:
